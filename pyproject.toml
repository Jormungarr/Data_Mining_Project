[project]
name = "hk-flu-hospital-pressure"
version = "0.1.0"
description = "Weekly panel of emergency-care load at Hong Kong public hospitals during influenza seasons"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "numpy>=2.5.3",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "requests>=2.34.2",
    "statsmodels>=0.15.0",
]

# This project is a set of data-pipeline scripts, not an installable package:
# there is no src/ layout and no wheel to build. Declaring it as unpackaged
# stops `uv sync` from looking for src/<name>/__init__.py and failing.
[tool.uv]
package = false
